[project]
name = "display-patterns"
# Version derives from git tags (hatch-vcs); flywheel cuts the tags.
dynamic = ["version"]
description = "Deterministic display test patterns, device-free and exact"
authors = [
    { name = "Ritchie Argue", email = "4462072+repentsinner@users.noreply.github.com" },
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "test-patterns",
    "display",
    "video",
    "calibration",
    "measurement",
    "checkerboard",
    "charts",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.3.1",
]

[project.optional-dependencies]
charts = [
    "colour-science>=0.4.6",
    "pillow>=12.1.1",
    "pyyaml>=6.0.1",
    # Not imported directly: colour-science uses scipy opportunistically
    # (CCT/chromatic adaptation) and warns at import when it is absent.
    "scipy>=1.16.3",
]
io = [
    "tifffile>=2024.8.30",
]

[project.urls]
Homepage = "https://github.com/OpenLEDEval/display-patterns"
Repository = "https://github.com/OpenLEDEval/display-patterns.git"
Issues = "https://github.com/OpenLEDEval/display-patterns/issues"
Changelog = "https://github.com/OpenLEDEval/display-patterns/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["display_patterns"]

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "C90", # mccabe complexity
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "RUF", # Ruff-specific rules
    # Blanket `# type: ignore` can silence version-compatibility errors
    # against the 3.12 floor (precedent: bmd-signal-gen's 3.13-only
    # enum-alias call hid behind one).
    "PGH003", # blanket-type-ignore
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "T20"]
"tools/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["display_patterns"]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["display_patterns", "tests"]
exclude = ["**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true
reportInconsistentConstructor = true
reportMissingParameterType = true
reportUnnecessaryTypeIgnoreComment = true
reportMissingModuleSource = false
reportUnnecessaryCast = true

[tool.pytest.ini_options]
testpaths = ["tests"]
