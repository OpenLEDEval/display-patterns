name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ruff and pyright are pinned to py312 in pyproject.toml, so one leg
  # carries the full lint signal; only pytest is version-sensitive.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run pytest

  # Prove the numpy-only core: install the built wheel without extras into a
  # clean environment and run the core probe (§spec:package-shape).
  core-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl python tools/check_core_install.py

  # The extraction gate: moved modules render array-for-array equal to
  # bmd-signal-gen's in-tree implementation (§spec:extraction).
  equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: OpenLEDEval/bmd-signal-gen
          path: bmd-signal-gen
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run pytest tests/test_bmd_equivalence.py
        env:
          BMD_SIGNAL_GEN_REPO: ${{ github.workspace }}/bmd-signal-gen
